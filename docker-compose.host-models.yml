# Optional overlay: the api container reads the embedding and reranker models
# from this machine's Hugging Face cache, read-only and offline, instead of
# downloading about 1.3 GB into the stack's own volume on first start.
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.host-models.yml make stack-up
#
# (COMPOSE_FILE can also go in .env.) The cache must already hold
# BAAI/bge-small-en-v1.5 and BAAI/bge-reranker-base, for example from
# `make seed` on the host. HF_HUB_CACHE moves it from the default location.
services:
  api:
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HF_HUB_CACHE:-~/.cache/huggingface/hub}:/root/.cache/huggingface/hub:ro
