# RegDelta local stack: postgres (pgvector) + api + web.
# Single-user, local-only: every port is published on loopback. No auth, no
# cloud config by design.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-regdelta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regdelta}
      POSTGRES_DB: ${POSTGRES_DB:-regdelta}
    ports:
      # Host side follows POSTGRES_PORT so a machine whose 5432 is taken can
      # move it (e.g. POSTGRES_PORT=55432 in .env); loopback only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regdelta} -d ${POSTGRES_DB:-regdelta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      # Optional so `docker compose up postgres` works before .env exists.
      - path: .env
        required: false
    environment:
      # Inside the compose network postgres is reachable by service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Listen on the container's interface; the port mapping below still
      # publishes it on the host's loopback only.
      API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount corpus + policy packs read-only for ingestion.
      - ./data:/app/data
      # Persist downloaded embedding/reranker models across restarts.
      - modelcache:/root/.cache

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Vite proxies /api to the api service; see frontend/vite.config.ts.
      VITE_API_BASE: /api
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  modelcache:
