name: CI

# Fast gates on pushes to main and to repair branches, and on pull requests.
# The research evaluation (four retrieval modes, tens of seconds per reranked
# query on CPU) runs separately in evaluation.yml, on demand.
#
# Intended path for the repair branch: once a push is authorised, pushing
# repair/regdelta-cleanup runs these four jobs on it (the "repair/**" filter);
# a pull request into main then runs them again on the merge result. Manual
# runs (workflow_dispatch) are available after this file reaches main, which
# GitHub requires before it offers the button.
#
# Visual baselines in frontend/e2e/__screenshots__ were rendered on an Ubuntu
# 24.04 base, so the jobs run on ubuntu-24.04 rather than a moving "latest".
# A screenshot difference fails the e2e job and the report (with the diff
# images) is uploaded; it is inspected and, if intended, accepted locally.
# This workflow never updates snapshots.

on:
  push:
    branches: [main, "repair/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regdelta
          POSTGRES_PASSWORD: regdelta
          POSTGRES_DB: regdelta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regdelta -d regdelta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      # The default provider; no test makes a model call.
      LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5@5c38ec7c-bge-reranker-base@2cfc18c9
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock --extra-index-url "$TORCH_INDEX"
          pip install -e backend --no-deps
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        working-directory: backend
        run: mypy app/ai
      - name: Test database
        env:
          POSTGRES_DB: regdelta_test
        run: python -m ingestion.prepare_db
      - name: Unit and integration tests
        working-directory: backend
        env:
          POSTGRES_DB: regdelta_test
          PYTHONPATH: ".:.."
        # -rs lists every skipped test, so a skip cannot pass unnoticed.
        run: pytest -q -rs

  retrieval-gate:
    runs-on: ubuntu-24.04
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regdelta
          POSTGRES_PASSWORD: regdelta
          POSTGRES_DB: regdelta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regdelta -d regdelta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: regdelta_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5@5c38ec7c-bge-reranker-base@2cfc18c9
      - name: Install (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock --extra-index-url "$TORCH_INDEX"
          pip install -e backend --no-deps
      # The baseline was measured on exactly this corpus (see evaluation/baseline.json).
      - name: Build the 60-document CI corpus
        run: |
          python -m ingestion.prepare_db
          python -m ingestion.seed --count 60
      - name: Hybrid retrieval gate
        run: python -m evaluation.check_baseline
      - name: Extraction and refusal suites
        run: |
          python -m evaluation.build_extraction_labels --count 30
          python -m evaluation.run_suites --suite extraction
          python -m evaluation.run_suites --suite refusal

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint and format
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck (app and end-to-end specs)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build
      # The web image: npm ci from the lockfile, the same build, nginx with
      # the /api proxy. `nginx -t` checks the rendered configuration.
      - name: Build the web image and check its nginx configuration
        run: |
          docker build -t regdelta-web:ci frontend
          docker run --rm regdelta-web:ci nginx -t

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regdelta
          POSTGRES_PASSWORD: regdelta
          POSTGRES_DB: regdelta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regdelta -d regdelta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5@5c38ec7c-bge-reranker-base@2cfc18c9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock --extra-index-url "$TORCH_INDEX"
          pip install -e backend --no-deps
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Seed the disposable end-to-end database (full synthetic demo corpus)
        run: |
          POSTGRES_DB=regdelta_e2e python -m ingestion.prepare_db
          POSTGRES_DB=regdelta_e2e python -m ingestion.seed
      - name: End-to-end tests
        working-directory: frontend
        env:
          REGDELTA_E2E_DB: regdelta_e2e
        run: npx playwright test
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
