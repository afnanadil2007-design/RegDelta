# Lint and format configuration for every Python package in the repository:
# backend/ (the `app` package and its tests), ingestion/, evaluation/ and
# mcp_server/. Run from the repo root: `ruff check .` and `ruff format .`.
line-length = 100
target-version = "py311"
# Lets isort recognise `app` and `tests` (both under backend/) as first-party.
src = [".", "backend"]

[lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in a parameter default is the documented FastAPI idiom.
ignore = ["B008"]

[lint.isort]
known-first-party = ["app", "ingestion", "evaluation", "mcp_server", "tests"]
# backend/alembic/ holds migration scripts, not the alembic library.
known-third-party = ["alembic"]

[lint.per-file-ignores]
# The corpus generator holds sentence templates as data; wrapping them would
# split regulatory-style sentences mid-clause.
"ingestion/generate_corpus.py" = ["E501"]
# Alembic revisions are generated; keep them diffable against autogenerate.
"backend/alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035", "UP017"]

[format]
exclude = ["backend/alembic/versions/*.py"]
